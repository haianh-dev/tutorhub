# =============================================================================
# Spring Boot — Profile: dev (local development)
# =============================================================================
# Kích hoạt: java -Dspring.profiles.active=dev -jar ...
#         hoặc SPRING_PROFILES_ACTIVE=dev (biến môi trường)
#         hoặc mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Các giá trị ở đây ghi đè application.yml khi profile này active.
# =============================================================================

spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/tutorhub}
    username: ${DB_USER:tutorhub_user}
    password: ${DB_PASSWORD:tutorhub_password}

  jpa:
    show-sql: true          # Hiện SQL trong console khi dev (tắt ở prod)
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

# Actuator: bật thêm endpoint khi dev để debug
management:
  endpoints:
    web:
      exposure:
        include: health, info, env, beans, flyway

logging:
  level:
    com.tutorhub:          DEBUG
    org.springframework.web: INFO
    org.flywaydb:          INFO
