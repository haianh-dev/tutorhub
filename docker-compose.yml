version: "3.9"

# =============================================================================
# TutorHub — Docker Compose (local development)
# =============================================================================
# Chạy chỉ database:  docker compose up -d db
# Chạy kèm pgAdmin:  docker compose --profile tools up -d
# Dừng tất cả:       docker compose down
# Xóa data volume:   docker compose down -v   (CẨN THẬN: mất data local)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — database chính
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tutorhub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-tutorhub}
      POSTGRES_USER:     ${DB_USER:-tutorhub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tutorhub_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tutorhub_user} -d ${DB_NAME:-tutorhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # pgAdmin — giao diện quản lý DB (tùy chọn, chỉ dùng khi cần)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tutorhub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@tutorhub.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools   # chỉ khởi động khi: docker compose --profile tools up -d

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
